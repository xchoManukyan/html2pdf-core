name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # must match the toolchain in go.mod (scripts/check-versions.sh checks it)
  GO_VERSION: '1.27.4'

jobs:
  test:
    name: Go on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Versions agree
        if: runner.os == 'Linux'
        run: sh scripts/check-versions.sh
      - name: All platforms build
        if: runner.os == 'Linux'
        run: sh scripts/build.sh
