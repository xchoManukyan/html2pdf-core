<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Complex scripts</title>
<style>
  body { font-family: sans-serif; font-size: 34px; line-height: 1.5; margin: 0; }
  p { margin: 0 0 6px; }
  .note { font-family: Arial, sans-serif; font-size: 12px; color: #6b7280; }

<body>
  <p class="note">Installed fonts only (no @font-face): shaped with each font's OpenType rules.</p>

  <p lang="ta">தமிழ் மொழி கொண்டு கை</p>
  <p lang="ar" dir="rtl">مرحبا بالعالم، السلامُ عليكم لا إله</p>
</body>
</html>
